name: Build mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Comprobar DLLs
        run: |
          ls -la libs
          test -f libs/Survivalcraft23.dll
          test -f libs/EntitySistem23.dll
          test -f libs/Engine23.dll

      - name: Compilar
        run: dotnet build HealthBarMod.csproj -c Release -o out

      - name: Empaquetar .scmod
        run: |
          mkdir pkg
          cp out/HealthBarMod.dll pkg/
          cp modinfo.json pkg/
          cd pkg && zip -r ../HealthBar.scmod .

      - uses: actions/upload-artifact@v4
        with:
          name: HealthBar.scmod
          path: HealthBar.scmod
