name: Build mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Listar archivos del repo
        run: ls -R | head -100

      - name: Comprobar DLLs
        run: |
          for f in Survivalcraft23 EntitySystem23 Engine23; do
            if [ -f "$f.dll" ]; then
              echo "OK: $f.dll"
            else
              echo "FALTA: $f.dll"
              exit 1
            fi
          done

      - name: Compilar
        run: dotnet build HealthBarMod.csproj -c Release -o out 2>&1 | grep -E "error|Warn|Build succeeded|Error" || true; test -f out/HealthBarMod.dll

      - name: Empaquetar .scmod
        run: |
          mkdir pkg
          cp out/HealthBarMod.dll pkg/
          cp modinfo.json pkg/
          cd pkg && zip -r ../HealthBar.scmod .

      - uses: actions/upload-artifact@v4
        with:
          name: HealthBar.scmod
          path: HealthBar.scmod
