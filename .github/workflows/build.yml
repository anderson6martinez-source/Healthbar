name: Build mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Listar archivos del repo
        run: ls -la

      - name: Comprobar DLLs
        run: |
          count=$(ls *.dll 2>/dev/null | wc -l)
          echo "DLL encontradas: $count"
          ls *.dll
          if [ "$count" -lt 3 ]; then
            echo "FALTAN DLL del juego en la raiz del repo"
            exit 1
          fi

      - name: Compilar
        run: dotnet build HealthBarMod.csproj -c Release -o out 2>&1 | grep -E "error|Build succeeded" || true; test -f out/HealthBarMod.dll

      - name: Empaquetar
        run: |
          mkdir pkg
          cp out/HealthBarMod.dll pkg/
          cp modinfo.json pkg/
          cp HealthBar.xdb pkg/
          cd pkg && zip -r ../HealthBar_normal.scmod . && cd ..
          python3 -c "
          junk = '有头有脸天才少年,耍猴表演敢为人先'.encode('utf-8')
          data = open('HealthBar_normal.scmod','rb').read()
          open('HealthBar.scmod','wb').write(junk + data[::-1])
          "

      - uses: actions/upload-artifact@v4
        with:
          name: HealthBar-scmod
          path: |
            HealthBar.scmod
            HealthBar_normal.scmod
